<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 1040" role="img" aria-labelledby="title desc"><title id="title">知识债如何形成</title><desc id="desc">有条件的机制假设，不是已经验证的普遍规律。省略验证、错误复用、依据流失与纠错受阻可能形成循环。保留原始材料、独立确定验收标准及安排接管演练可截断传播。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#a32929" stroke-width="2"/></marker></defs><rect width="340" height="1040" fill="#f2ebdc"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#1a1812"><rect x="18" y="22" width="5" height="58" fill="#a32929"/><text x="34" y="50" font-size="28" font-weight="700">知识债如何形成</text><text x="34" y="77" font-size="12" letter-spacing="2" fill="#a32929">KNOWLEDGE / DEBT</text><text x="20" y="112" font-size="17" font-weight="600">有条件的机制假设</text><text x="20" y="138" font-size="15">并非已验证的普遍规律</text><rect x="20" y="168" width="284" height="100" rx="4" fill="#fbf6ec" stroke="#b28a3b"/><text x="35" y="207" font-family="Georgia,serif" font-size="32" fill="#a32929">01</text><text x="87" y="207" font-size="26" font-weight="700">省略验证</text><text x="35" y="245" font-size="17">以交付速度代替核实</text><path d="M160 271V287" stroke="#a32929" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="292" width="284" height="100" rx="4" fill="#fbf6ec" stroke="#b28a3b"/><text x="35" y="331" font-family="Georgia,serif" font-size="32" fill="#a32929">02</text><text x="87" y="331" font-size="26" font-weight="700">错误复用</text><text x="35" y="369" font-size="17">未经确认的结论进入下游</text><path d="M160 395V411" stroke="#a32929" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="416" width="284" height="100" rx="4" fill="#fbf6ec" stroke="#b28a3b"/><text x="35" y="455" font-family="Georgia,serif" font-size="32" fill="#a32929">03</text><text x="87" y="455" font-size="26" font-weight="700">依据流失</text><text x="35" y="493" font-size="17">接手者找不到原始理由</text><path d="M160 519V535" stroke="#a32929" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="540" width="284" height="100" rx="4" fill="#fbf6ec" stroke="#b28a3b"/><text x="35" y="579" font-family="Georgia,serif" font-size="32" fill="#a32929">04</text><text x="87" y="579" font-size="26" font-weight="700">纠错受阻</text><text x="35" y="617" font-size="17">修改与接管变得困难</text><path d="M304 590H322V210H309" stroke="#a32929" fill="none" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="20" y="704" font-size="18" fill="#a32929" font-weight="700">若继续依赖未经核实的输出，</text><text x="20" y="732" font-size="22" fill="#a32929" font-weight="700">风险可能累积</text><path d="M20 762H320" stroke="#1a1812" stroke-width="2"/><text x="20" y="799" font-size="16" letter-spacing="2">可截断传播的措施</text><rect x="20" y="824" width="300" height="48" fill="#1a1812"/><rect x="20" y="824" width="5" height="48" fill="#a32929"/><text x="38" y="856" font-size="21" font-weight="700" fill="#f2ebdc">保留原始材料</text><rect x="20" y="886" width="300" height="48" fill="#1a1812"/><rect x="20" y="886" width="5" height="48" fill="#a32929"/><text x="38" y="918" font-size="21" font-weight="700" fill="#f2ebdc">独立确定验收标准</text><rect x="20" y="948" width="300" height="48" fill="#1a1812"/><rect x="20" y="948" width="5" height="48" fill="#a32929"/><text x="38" y="980" font-size="21" font-weight="700" fill="#f2ebdc">安排接管演练</text></g></svg>