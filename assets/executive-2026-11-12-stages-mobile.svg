<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1100" viewBox="0 0 620 1100"><rect width="100%" height="100%" fill="#f3f6fa"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="52" font-size="28" font-weight="bold" fill="#142b45">从信息到决策：四道核验</text><text x="32" y="86" font-size="17" fill="#526477">原创概念图 · 2026年11月12日 · 不代表成交概率</text><rect x="32" y="118" width="556" height="200" rx="18" fill="white" stroke="#d8e1eb"/><rect x="32" y="118" width="556" height="7" rx="3" fill="#087f8c"/><text x="52" y="158" font-size="22" fill="#087f8c">01  合作启动</text><text x="52" y="204" font-size="21" fill="#142b45">先找需求与付费主体</text><text x="52" y="246" font-size="20" fill="#142b45">报告 ≠ 采购预算</text><text x="52" y="289" font-size="15" fill="#526477">来源：科技部 [1]</text><rect x="32" y="340" width="556" height="200" rx="18" fill="white" stroke="#d8e1eb"/><rect x="32" y="340" width="556" height="7" rx="3" fill="#087f8c"/><text x="52" y="380" font-size="22" fill="#087f8c">02  中标结果</text><text x="52" y="426" font-size="21" fill="#142b45">再看合同与开通</text><text x="52" y="468" font-size="20" fill="#142b45">中标 ≠ 已经使用</text><text x="52" y="511" font-size="15" fill="#526477">来源：北京经开区 [2]</text><rect x="32" y="562" width="556" height="200" rx="18" fill="white" stroke="#d8e1eb"/><rect x="32" y="562" width="556" height="7" rx="3" fill="#087f8c"/><text x="52" y="602" font-size="22" fill="#087f8c">03  定向框架</text><text x="52" y="648" font-size="21" fill="#142b45">核对邀请与实际用量</text><text x="52" y="690" font-size="20" fill="#142b45">预估 ≠ 收入承诺</text><text x="52" y="733" font-size="15" fill="#526477">来源：采购邀请函 [3]</text><rect x="32" y="784" width="556" height="200" rx="18" fill="white" stroke="#d8e1eb"/><rect x="32" y="784" width="556" height="7" rx="3" fill="#087f8c"/><text x="52" y="824" font-size="22" fill="#087f8c">04  技术发布</text><text x="52" y="870" font-size="21" fill="#142b45">回读文档并实际验证</text><text x="52" y="912" font-size="20" fill="#142b45">宣布 ≠ 独立实测</text><text x="52" y="955" font-size="15" fill="#526477">来源：厂商及仓库 [4—7]</text><text x="32" y="1074" font-size="15" fill="#526477">来源详见正文；阶段和责任应分别确认。</text></g></svg>