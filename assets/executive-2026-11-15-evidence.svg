<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="100%" height="100%" fill="#f1f5f9"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#14304c"><text x="32" y="50" font-size="28" font-weight="700">经营判断：先分清证据到了哪一步</text><text x="32" y="90" font-size="18">不同证据状态，不可直接换算为经营收入</text><rect x="32" y="140" width="360" height="150" rx="12" fill="#fff"/><text x="52" y="176" font-size="24" fill="#087f8c" font-weight="700">金融安排与目标</text><text x="52" y="220" font-size="18">先核：细则、资格、实际发放</text><text x="52" y="260" font-size="18">不等于已到账补贴或AI订单</text><rect x="420" y="140" width="360" height="150" rx="12" fill="#fff"/><text x="440" y="176" font-size="24" fill="#087f8c" font-weight="700">采购公告与中标</text><text x="440" y="220" font-size="18">先核：需求、合同、验收责任</text><text x="440" y="260" font-size="18">预算与中标不等于收入实现</text><rect x="808" y="140" width="360" height="150" rx="12" fill="#fff"/><text x="828" y="176" font-size="24" fill="#087f8c" font-weight="700">限时原型与演示</text><text x="828" y="220" font-size="18">先核：真实任务、长期运行、付费</text><text x="828" y="260" font-size="18">作品可用不等于生产验证</text><text x="32" y="415" font-size="18">原创分析框架 · 示意性质 · 非统计排名</text><text x="32" y="450" font-size="17">依据本期公开来源[1]—[8] · 不表示各阶段必然转化</text></g></svg>