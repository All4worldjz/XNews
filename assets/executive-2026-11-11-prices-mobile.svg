<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1460" viewBox="0 0 720 1460" role="img" aria-labelledby="title desc">
<title id="title">五个价格指标，不是一张成本单</title>
<desc id="desc">2026年10月全国价格同比涨幅：CPI0.7%，核心CPI0.8%，PPI5.7%，工业生产者购进价格7.9%，计算机通信及其他电子设备制造业出厂价格5.9%。不同口径不能相加或计算利润差。</desc>
<rect width="720" height="1460" rx="24" fill="#0e1a2b"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;} .light{fill:#f5f7fb} .muted{fill:#a9bdd2} .teal{fill:#5de1c5}</style>
<text x="40" y="62" font-size="23" font-weight="600" class="teal">XNEWS / 高管简报 · 2026.11.11</text>
<text x="40" y="130" font-size="45" font-weight="700" class="light">五个价格指标</text>
<text x="40" y="190" font-size="45" font-weight="700" class="light">不是一张成本单</text>
<text x="40" y="240" font-size="25" font-weight="400" class="muted">2026年10月 · 全国同比 · %</text>
<rect x="32" y="280" width="656" height="155" rx="18" fill="#192b42"/>
<text x="56" y="320" font-size="26" font-weight="600" class="light">CPI</text>
<text x="56" y="361" font-size="22" font-weight="400" class="muted">居民消费价格</text>
<text x="56" y="398" font-size="21" font-weight="400" class="teal">消费篮子</text>
<text x="520" y="360" font-size="52" font-weight="700" class="light">+0.7</text>
<rect x="32" y="455" width="656" height="155" rx="18" fill="#192b42"/>
<text x="56" y="495" font-size="26" font-weight="600" class="light">核心CPI</text>
<text x="56" y="536" font-size="22" font-weight="400" class="muted">扣除食品和能源</text>
<text x="56" y="573" font-size="21" font-weight="400" class="teal">消费篮子</text>
<text x="520" y="535" font-size="52" font-weight="700" class="light">+0.8</text>
<rect x="32" y="630" width="656" height="155" rx="18" fill="#192b42"/>
<text x="56" y="670" font-size="26" font-weight="600" class="light">PPI</text>
<text x="56" y="711" font-size="22" font-weight="400" class="muted">工业生产者出厂价格</text>
<text x="56" y="748" font-size="21" font-weight="400" class="teal">出厂环节</text>
<text x="520" y="710" font-size="52" font-weight="700" class="light">+5.7</text>
<rect x="32" y="805" width="656" height="155" rx="18" fill="#192b42"/>
<text x="56" y="845" font-size="26" font-weight="600" class="light">工业购进价格</text>
<text x="56" y="886" font-size="22" font-weight="400" class="muted">工业生产者投入品价格</text>
<text x="56" y="923" font-size="21" font-weight="400" class="teal">购进环节</text>
<text x="520" y="885" font-size="52" font-weight="700" class="light">+7.9</text>
<rect x="32" y="980" width="656" height="155" rx="18" fill="#192b42"/>
<text x="56" y="1020" font-size="26" font-weight="600" class="light">电子设备制造业</text>
<text x="56" y="1061" font-size="22" font-weight="400" class="muted">计算机、通信及其他电子设备</text>
<text x="56" y="1098" font-size="21" font-weight="400" class="teal">行业出厂环节</text>
<text x="520" y="1060" font-size="52" font-weight="700" class="light">+5.9</text>
<text x="40" y="1210" font-size="25" font-weight="600" class="teal">不同范围与权重，不合计、不算利润差。</text>
<text x="40" y="1255" font-size="25" font-weight="400" class="light">不是某款GPU、电价或云服务的涨幅。</text>
<text x="40" y="1330" font-size="22" font-weight="400" class="muted">数据：国家统计局11月9日CPI、PPI公告</text>
<text x="40" y="1370" font-size="22" font-weight="400" class="muted">同比基准：2025年10月；原创数据示意</text>
<text x="40" y="1410" font-size="22" font-weight="400" class="muted">项目决策仍须使用真实报价与合同。</text>
</svg>
